databases:
  - name: ticketing_db
    databaseName: ticketing
    user: ticketing_user
    plan: free

services:
  - type: web
    name: ticketing-system
    env: python
    buildCommand: ./build.sh
    startCommand: gunicorn ticketing_project.wsgi:application
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: ticketing_db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.5
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
